apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-helm
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://yahav2305-sailpoint.github.io/app-helm
      chart: app-helm
      targetRevision: '*'
      helm:
        valueFiles:
          - $gitops/values.yaml
    - repoURL: https://github.com/yahav2305-sailpoint/gitops.git
      targetRevision: HEAD
      ref: gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true